name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build and check version
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          go build -buildvcs=true -trimpath -ldflags="-X main.releaseVersion=$RELEASE_TAG" -o motd ./cmd/motd
          version=$(./motd --version)
          if [ -n "$RELEASE_TAG" ]; then
            test "$version" = "$RELEASE_TAG"
          else
            [[ "$version" == devel+* ]]
          fi
      - name: Test SSH login
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          sudo bash tests/ssh.sh ./motd

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binaries and checksums
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -buildvcs=true -trimpath -ldflags="-X main.releaseVersion=$RELEASE_TAG" -o "dist/motd_${os}_${arch}" ./cmd/motd
            done
          done
          test "$(./dist/motd_linux_amd64 --version)" = "$RELEASE_TAG"
          cd dist
          sha256sum motd_* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
